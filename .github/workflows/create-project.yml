name: Setup GitHub Project

# Crea/actualiza el Project del portfolio (Iniciativas, Epicas, Historias),
# los milestones del roadmap y los campos personalizados.
#
# Requiere un PAT con scopes: repo, project.
#   - Guardalo como secreto del repo con el nombre: PROJECT_TOKEN
#     (Settings > Secrets and variables > Actions > New repository secret)
#   - O pasalo manualmente en el input "token" al lanzar el workflow.

on:
  workflow_dispatch:
    inputs:
      token:
        description: "PAT con scopes repo,project (opcional si existe el secreto PROJECT_TOKEN)"
        required: false
        type: string
      dry_run:
        description: "Solo mostrar lo que se haria (no aplica cambios)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comprobar jq
        run: jq --version

      - name: Ejecutar setup del Project
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          INPUT_TOKEN: ${{ inputs.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          TOKEN="${INPUT_TOKEN:-${PROJECT_TOKEN:-}}"
          if [ -z "$TOKEN" ]; then
            echo "::error::No hay token. Crea el secreto PROJECT_TOKEN o pasa el input 'token'."
            exit 1
          fi
          chmod +x scripts/setup-project.sh
          ./scripts/setup-project.sh "$TOKEN"

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Setup del GitHub Project"
            echo ""
            echo "Si el paso anterior fue correcto, tu Project ya esta listo."
            echo ""
            echo "### Vistas recomendadas"
            echo "1. **Board** agrupado por \`Estado\`"
            echo "2. **Roadmap** con \`Inicio\` y \`Fecha objetivo\`"
            echo "3. **Table** agrupada por \`Tipo\`"
            echo ""
            echo "### Filtros utiles"
            echo '- `horizon:"Ahora"`'
            echo '- `priority:"P0 - Crítica"`'
            echo '- `-tipo:"Historia de Usuario"` (solo estructura)'
          } >> "$GITHUB_STEP_SUMMARY"
