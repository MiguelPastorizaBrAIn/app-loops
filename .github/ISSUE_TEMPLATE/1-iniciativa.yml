name: "1 · Iniciativa"
description: "Objetivo estratégico de un trimestre. Nivel más alto del portfolio."
title: "INIT-x · "
labels: ["type:initiative"]
body:
  - type: markdown
    attributes:
      value: |
        Una **Iniciativa** es un objetivo estratégico (un trimestre).
        Después crea sus **Épicas** como sub-issues.
  - type: input
    id: horizonte
    attributes:
      label: Horizonte
      description: "Ahora / Siguiente / Después"
      placeholder: "Ahora"
    validations:
      required: true
  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo
      description: "¿Qué resultado de negocio/técnico quieres lograr?"
      placeholder: "Tener una base técnica sólida para automatizaciones con IA."
    validations:
      required: true
  - type: textarea
    id: resultado
    attributes:
      label: Resultado esperado (Definition of Done de la iniciativa)
      value: |
        - [ ] Resultado medible 1
        - [ ] Resultado medible 2
    validations:
      required: true
  - type: input
    id: inicio
    attributes:
      label: Fecha de inicio
      placeholder: "AAAA-MM-DD"
    validations:
      required: true
  - type: input
    id: objetivo_fecha
    attributes:
      label: Fecha objetivo
      placeholder: "AAAA-MM-DD"
    validations:
      required: true
  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad
      options:
        - "P0 - Crítica"
        - "P1 - Alta"
        - "P2 - Media"
        - "P3 - Baja"
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Al crearla
      options:
        - label: "Añadir al Project y poner Tipo = Iniciativa"
          required: true
        - label: "Asignar Inicio y Fecha objetivo"
          required: true
